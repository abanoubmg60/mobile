name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.28.4-premoves)'
        required: true
        default: 'v0.28.4-premoves'
        type: string
      release_name:
        description: 'Release Title'
        required: false
        default: 'Lichess Mobile (Multi-Premoves & Live Eval)'
        type: string
      target_arch:
        description: 'Target Architecture (arm64-v8a = ~45MB & 4-5m build, universal = ~160MB)'
        required: true
        default: 'arm64-v8a'
        type: choice
        options:
          - 'arm64-v8a'
          - 'universal'
      draft:
        description: 'Create as a draft release?'
        required: true
        type: boolean
        default: false
      prerelease:
        description: 'Mark as pre-release?'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Verify Environment
        run: |
          flutter --version
          java -version

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      # Ensure keystore permissions and verify key.properties exist
      - name: Verify Release Keystore
        run: |
          ls -la android/app/upload-keystore.jks android/key.properties

      - name: Build Release APK
        run: |
          TARGET_ARCH="${{ github.event.inputs.target_arch || 'arm64-v8a' }}"
          mkdir -p release-apks
          if [ "$TARGET_ARCH" = "universal" ]; then
            echo "Building Universal APK..."
            flutter build apk --release \
              --dart-define=cronetHttpNoPlay=true \
              --dart-define=LICHESS_HOST=lichess.org \
              --dart-define=LICHESS_WS_HOST=socket.lichess.org \
              --dart-define=LICHESS_WS_SECRET=wG1OLhUR3CSXdDybqrtIW227QGrtiM3d
            cp build/app/outputs/flutter-apk/app-release.apk release-apks/lichess-mobile-universal.apk
          else
            echo "Building arm64-v8a Optimized APK..."
            flutter build apk --release \
              --target-platform=android-arm64 \
              -PtargetAbi=arm64-v8a \
              --dart-define=cronetHttpNoPlay=true \
              --dart-define=LICHESS_HOST=lichess.org \
              --dart-define=LICHESS_WS_HOST=socket.lichess.org \
              --dart-define=LICHESS_WS_SECRET=wG1OLhUR3CSXdDybqrtIW227QGrtiM3d
            cp build/app/outputs/flutter-apk/app-release.apk release-apks/lichess-mobile-arm64-v8a.apk
          fi
          ls -lh release-apks/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lichess-mobile-apk
          path: release-apks/*
          retention-days: 14

      - name: Determine Release Tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
            echo "title=${{ github.event.inputs.release_name || github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "title=Lichess Mobile $TAG" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.title }}
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
          files: release-apks/*
